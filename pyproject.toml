[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-expy"
version = "0.3.0"
description = "Python library for EEG cognitive neuroscience experiments"
readme = "README.rst"
license = "BSD-3-Clause"
requires-python = ">=3.11"
authors = [
    { name = "John David Griffiths", email = "j.davidgriffiths@gmail.com" },
]
keywords = [
    "eeg",
    "cognitive neuroscience",
    "experiments",
    "evoked response",
    "auditory",
    "visual",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.16",
    "pandas>=2.2",
    "mne>=1.7",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "matplotlib>=3.8",
    "h5py>=3.10",
    "pyserial>=3.5",
    "gdown>=5.1",
    "click>=8.1",
    "airium>=0.2",
    "jupyter",
    "jinja2>=3.1",
]

[project.optional-dependencies]
analysis = [
    "pyriemann>=0.6",
    "fooof>=1.1",
]
streaming = [
    "brainflow>=5.10",
    "pylsl>=1.17",
    "muselsl>=2.3",
]
stimpres = [
    "psychopy==2026.1.3",
    "psychtoolbox>=3.0.19",
    "sounddevice>=0.4",
    "ffpyplayer>=4.5",
]
streamstim = ["eeg-expy[streaming,stimpres]"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-shutil",
    "nbval",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-requests",
]
docs = [
    "sphinx>=7",
    "sphinx-gallery",
    "sphinx_rtd_theme",
    "sphinx-tabs",
    "sphinx-copybutton",
    "sphinxcontrib-httpdomain",
    "numpydoc",
    "recommonmark",
    "rst2pdf",
    "docutils",
]
full = ["eeg-expy[analysis,streaming,stimpres,dev,docs]"]

[project.urls]
Homepage = "https://github.com/NeuroTechX/eeg-expy"
Documentation = "https://neurotechx.github.io/EEG-ExPy/"
Repository = "https://github.com/NeuroTechX/eeg-expy"

[project.scripts]
eegnb = "eegnb.cli.__main__:main"
eegexpy = "eegnb.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["eegnb*", "eegexpy*"]
exclude = ["tests*", "examples*", "doc*", "environments*", "binder*"]

[tool.setuptools.package-data]
eegnb = ["stimuli/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = [
    "E501",   # line-too-long — handled by formatter
    "E741",   # ambiguous var name (single-letter is fine in science code)
    "B008",   # function calls in argument defaults (common in PsychoPy paradigm defs)
]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E402", "F401", "F841"]
"tests/**" = ["F401", "F811"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = """
    --cov=eegnb
    --cov-report=term
    --cov-report=xml
    --cov-report=html
    --nbval-lax
    --current-env
    --ignore-glob 'examples/**.py'
    --ignore-glob '**/baseline_task.py'
"""
testpaths = [
    "eegnb",
    "tests",
]
python_files = ["*.py", "*.ipynb"]
