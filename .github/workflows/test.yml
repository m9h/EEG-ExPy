name: CI

on:
  push:
    branches: [master, develop, 'dev/*', 'morgan/*']
  pull_request:
    branches: [master, develop]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Ruff check
        run: uvx ruff@0.5 check eegnb tests

  import-smoke:
    name: import (py-${{ matrix.python_version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install system libs (PsychoPy/wxPython)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libnotify-dev libsdl2-dev libwebkit2gtk-4.1-dev \
            portaudio19-dev libpulse-dev xvfb
      - name: Install package
        run: |
          uv venv --python ${{ matrix.python_version }}
          uv pip install -e '.[streamstim]'
      - name: Import smoke test
        run: |
          Xvfb :0 -screen 0 1024x768x24 -ac +extension GLX +render -noreset &> xvfb.log &
          export DISPLAY=:0
          uv run python -c "import eegnb; from eegnb.experiments import VisualN170, VisualP300, VisualSSVEP, AuditoryOddball; print('ok')"
          uv run eegnb --help
